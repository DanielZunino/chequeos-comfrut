<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chequeos COMFRUT</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B1A8C">
<style>
:root{--dark:#0B1A8C;--dark2:#1225FD;--cyan:#3BDAFF;--amber:#F59E0B;--ok:#2E7D32;--okbg:#E3F4E4;--warn:#E65100;--warnbg:#FFF0E0;--bad:#C62828;--badbg:#FDE3E3;--doc:#6A1B9A;--bg:#EEF3FF;--card:#fff;--txt:#1F2D3A;--mut:#64748B;--line:#E2E8F0;--soft:#E8EDFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
header{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;padding:12px 16px 12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
header .t{font-weight:800;font-size:17px;letter-spacing:.2px}.hrow{display:flex;align-items:center;gap:12px}.logo{height:42px;background:#fff;border-radius:10px;padding:3px 6px}
.vozb{border:0;background:#ffffff22;color:#fff;font-size:22px;width:44px;height:44px;border-radius:12px;cursor:pointer;flex:0 0 44px}.vozb.off{opacity:.5}
.oir{border:0;background:var(--soft);color:var(--dark2);font-weight:800;font-size:13px;border-radius:9px;padding:5px 9px;cursor:pointer;margin-left:6px}
.hablando{outline:3px solid var(--amber);outline-offset:2px}header .s{color:var(--cyan);font-size:12.5px;font-weight:600;margin-top:2px}
.prog{height:6px;background:#ffffff30;border-radius:9px;margin-top:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--cyan);width:0;transition:width .3s}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px #0001,0 4px 14px #0b1a8c0f}
h2{margin:4px 0 6px;font-size:20px;color:var(--dark)}h3{margin:0 0 8px;font-size:16px;color:var(--dark)}
p.m{color:var(--mut);margin:0 0 12px;font-size:14.5px;line-height:1.4}
label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--txt)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dark2)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;background:var(--dark2);color:#fff;cursor:pointer;text-align:center}
.btn.am{background:var(--amber);color:#1b1b1b}.btn.gh{background:#fff;color:var(--dark);border:2px solid var(--line)}.btn:disabled{opacity:.45}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}.foot .btn{padding:14px}.foot .gh{flex:0 0 34%}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;margin:3px 4px 3px 0}
.b-ok{background:var(--okbg);color:var(--ok)}.b-w{background:var(--warnbg);color:var(--warn)}.b-x{background:var(--badbg);color:var(--bad)}.b-n{background:#EEF2F7;color:var(--mut)}
.eqs{display:grid;gap:10px}
.eq{display:flex;align-items:center;gap:12px;border:2.5px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.eq svg{flex:0 0 96px;height:58px}.eq b{font-size:16.5px;display:block}.eq span{font-size:13px;color:var(--mut)}
.eq.sel{border-color:var(--dark2);background:var(--soft)}.eq .sug{font-size:11.5px;font-weight:800;color:var(--ok);display:block;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.45}
.info.w{background:var(--warnbg)}.info.x{background:var(--badbg)}.info.g{background:var(--okbg)}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:6px}.bh .ic{font-size:34px;width:52px;height:52px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
.item{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff;transition:border-color .2s}
.item.v-B{border-color:#A5D6A7}.item.v-R{border-color:#FFCC80}.item.v-M{border-color:#EF9A9A}.item.v-NA{border-color:#CFD8DC}
.it-h{display:flex;gap:10px;align-items:flex-start}.it-h .e{font-size:24px;line-height:1}.it-h b{font-size:15.5px}
.crit{font-size:11px;font-weight:800;color:var(--bad);background:var(--badbg);border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}
.tip{font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.35}
.why{border:0;background:none;color:var(--dark2);font-weight:700;font-size:13px;padding:4px 0;cursor:pointer}
.whyt{display:none;font-size:13.5px;background:#FFF8E5;border-radius:10px;padding:8px 10px;margin-top:4px;line-height:1.4}.whyt.on{display:block}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.opts.sn{grid-template-columns:1fr 1fr}
.opts button{border:2px solid var(--line);background:#fff;border-radius:11px;padding:9px 2px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;color:var(--mut)}
.opts button .x{display:block;font-size:20px;margin-bottom:2px}
.opts .on.B{background:var(--ok);border-color:var(--ok);color:#fff}.opts .on.R{background:var(--warn);border-color:var(--warn);color:#fff}
.opts .on.M{background:var(--bad);border-color:var(--bad);color:#fff}.opts .on.NA{background:#78909C;border-color:#78909C;color:#fff}
.det{margin-top:10px;display:none}.det.on{display:block}.det textarea{min-height:58px;font-size:15px}
.ph{display:flex;align-items:center;gap:10px;margin-top:8px}.ph label{font-size:14px;font-weight:700;color:var(--dark2);cursor:pointer;border:2px dashed #B0BEC5;border-radius:10px;padding:8px 12px}
.ph img{height:54px;border-radius:8px}
.sem{border-radius:18px;padding:18px;text-align:center;color:#fff;margin-bottom:14px}
.sem .r{font-size:30px;font-weight:900;letter-spacing:.5px}.sem .m{font-size:15px;margin-top:4px;opacity:.95}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:#fff;border-radius:14px;padding:12px 6px;text-align:center;box-shadow:0 1px 3px #0001}.kpi b{display:block;font-size:24px}.kpi span{font-size:12px;color:var(--mut);font-weight:700}
.al{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.al:last-child{border:0}
.al i{font-style:normal;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 7px;height:fit-content;white-space:nowrap}
.lv-Crítica{background:var(--badbg);color:var(--bad)}.lv-Documento{background:#F3E5F5;color:var(--doc)}.lv-Media{background:var(--warnbg);color:var(--warn)}.lv-Leve{background:#EEF2F7;color:var(--mut)}
.who{display:flex;align-items:center;gap:12px;padding:11px;border:2px solid var(--line);border-radius:13px;margin-bottom:8px;cursor:pointer;background:#fff}
.who.on{border-color:var(--dark2);background:var(--soft)}.who .ck{width:26px;height:26px;border-radius:8px;border:2px solid #B0BEC5;display:grid;place-items:center;font-weight:900;color:#fff;flex:0 0 26px}
.who.on .ck{background:var(--dark2);border-color:var(--dark2)}.who b{font-size:15px}.who span{display:block;font-size:12.5px;color:var(--mut)}.who.lock{cursor:default}
canvas{width:100%;height:150px;border:2px dashed #B0BEC5;border-radius:12px;background:#fff;touch-action:none}
.center{text-align:center}.hero{width:min(320px,92%);height:auto;display:block;margin:4px auto 2px}.big{font-size:56px}.mut{color:var(--mut)}.small{font-size:13px}
.hide{display:none!important}.spin{width:42px;height:42px;border:5px solid #E2E8F0;border-top-color:var(--dark2);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}@keyframes s{to{transform:rotate(360deg)}}
.nuevo{border:2.5px dashed var(--amber);border-radius:14px;padding:12px;margin-top:12px;background:#FFFBF0}
.pie{text-align:center;color:#94A3B8;font-size:11.5px;margin-top:20px}
#mano{position:fixed;z-index:20;font-size:40px;pointer-events:none;filter:drop-shadow(0 3px 4px #0005);transition:left .35s ease,top .35s ease,opacity .25s;opacity:0}
#mano.on{opacity:1;animation:toque 1.1s ease-in-out infinite}
@keyframes toque{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pulso{animation:pulso 1.4s ease-in-out infinite;border-radius:14px}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 #F59E0B00}50%{box-shadow:0 0 0 6px #F59E0B88}}
.fecha-row{display:flex;gap:8px;align-items:center}.fecha-row input{font-size:20px;letter-spacing:1px;text-align:center;max-width:190px}
#rut{font-size:22px;letter-spacing:1px;text-align:center}
.cupo{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:800}.cupo .bar{flex:1;height:12px;background:#E2E8F0;border-radius:9px;overflow:hidden}.cupo .bar i{display:block;height:100%}
.stp{display:flex;align-items:center;gap:8px}.stp button{flex:0 0 60px;height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:24px;font-weight:900;color:var(--dark);cursor:pointer}.stp input{flex:1;min-width:0;text-align:center;font-size:24px;font-weight:800}
.sino{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}.sino button{border:2.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 6px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:var(--txt)}
.sino button.on{border-color:var(--dark2);background:var(--soft);color:var(--dark2)}.sino button .x{display:block;font-size:28px}
</style>
</head>
<body>
<header><div class="hrow"><img class="logo" id="logo" alt="COMFRUT" src="logo.jpg" onerror="this.style.display='none'"><div style="flex:1;min-width:0"><div class="t">Chequeos COMFRUT</div><div class="s" id="sub">Seguridad antes de partir</div></div><button id="bVoz" class="vozb" onclick="togVoz()" aria-label="Voz">🔊</button></div><div class="prog"><i id="bar"></i></div></header>
<main id="app"><div class="card center"><div class="spin"></div><p class="mut">Cargando…</p></div></main>
<div id="mano">👆</div>
<div class="foot hide" id="foot"><div class="in"><button class="btn gh" id="bBack">← Atrás</button><button class="btn am" id="bNext">Siguiente →</button></div></div>

<script>
// ===================== CONFIGURACIÓN =====================
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby76WcVMUql7oYraEZDDJhLVDKhn_dOOeqtpPGDs91G2aw2o3MDwDsSvXKtD_mlUCkf/exec';   // URL /exec del servidor Apps Script "Servidor chequeos COMFRUT"
const DIAS_AVISO = 30;               // documentos/licencia: avisar cuando falten menos de 30 días
const DIAS_SIN_CHEQUEO = 7;          // chequeo SEMANAL
const AVISO = { km: 1000, h: 25 }, INTERVALO = { km: 10000, h: 250 };
// ==========================================================

const SVG = {
  furgon: '<svg viewBox="0 0 130 70"><path d="M6 16h80l22 14 14 6v16H6z" fill="#fff" stroke="#0B1A8C" stroke-width="3"/><path d="M88 20l18 12H88z" fill="#BFE9FF"/><g fill="#BFE9FF"><rect x="14" y="22" width="16" height="11" rx="2"/><rect x="36" y="22" width="16" height="11" rx="2"/><rect x="58" y="22" width="16" height="11" rx="2"/></g><g fill="#7C5A3A"><circle cx="22" cy="29" r="3"/><circle cx="44" cy="29" r="3"/><circle cx="66" cy="29" r="3"/></g><rect x="6" y="40" width="116" height="5" fill="#1225FD"/><circle cx="28" cy="54" r="9" fill="#263238"/><circle cx="28" cy="54" r="4" fill="#B0BEC5"/><circle cx="100" cy="54" r="9" fill="#263238"/><circle cx="100" cy="54" r="4" fill="#B0BEC5"/></svg>',
  minibus: '<svg viewBox="0 0 130 70"><path d="M4 12h110q10 0 12 10v30H4z" fill="#fff" stroke="#0B1A8C" stroke-width="3"/><g fill="#BFE9FF"><rect x="10" y="18" width="14" height="13" rx="2"/><rect x="28" y="18" width="14" height="13" rx="2"/><rect x="46" y="18" width="14" height="13" rx="2"/><rect x="64" y="18" width="14" height="13" rx="2"/><rect x="82" y="18" width="14" height="13" rx="2"/><rect x="102" y="18" width="20" height="16" rx="2"/></g><g fill="#7C5A3A"><circle cx="17" cy="26" r="3"/><circle cx="35" cy="26" r="3"/><circle cx="53" cy="26" r="3"/><circle cx="71" cy="26" r="3"/><circle cx="89" cy="26" r="3"/></g><rect x="4" y="38" width="122" height="5" fill="#3BDAFF"/><circle cx="26" cy="54" r="9" fill="#263238"/><circle cx="26" cy="54" r="4" fill="#B0BEC5"/><circle cx="104" cy="54" r="9" fill="#263238"/><circle cx="104" cy="54" r="4" fill="#B0BEC5"/></svg>',
  tractor: '<svg viewBox="0 0 130 70"><path d="M40 10h26v26H40z" fill="none" stroke="#263238" stroke-width="4"/><rect x="44" y="14" width="18" height="16" fill="#BFE9FF"/><path d="M36 36h64l6 12H30z" fill="#2E7D32"/><rect x="66" y="26" width="34" height="12" rx="2" fill="#2E7D32"/><rect x="92" y="16" width="5" height="12" fill="#455A64"/><circle cx="46" cy="50" r="17" fill="#263238"/><circle cx="46" cy="50" r="7" fill="#F59E0B"/><circle cx="104" cy="56" r="10" fill="#263238"/><circle cx="104" cy="56" r="4" fill="#F59E0B"/><path d="M118 40l8-6 0 12z" fill="#F97316"/></svg>',
  comedor: '<svg viewBox="0 0 130 70"><rect x="4" y="14" width="78" height="38" rx="4" fill="#fff" stroke="#0B1A8C" stroke-width="3"/><path d="M2 14l42-10 42 10" fill="#1225FD"/><rect x="12" y="22" width="22" height="14" rx="2" fill="#BFE9FF"/><rect x="40" y="22" width="22" height="14" rx="2" fill="#BFE9FF"/><path d="M68 22h8v30h-8z" fill="#90A4AE"/><circle cx="24" cy="56" r="7" fill="#263238"/><circle cx="60" cy="56" r="7" fill="#263238"/><rect x="92" y="16" width="16" height="36" rx="3" fill="#3BDAFF"/><rect x="95" y="22" width="10" height="5" fill="#fff"/><rect x="112" y="16" width="16" height="36" rx="3" fill="#3BDAFF"/><rect x="115" y="22" width="10" height="5" fill="#fff"/><path d="M100 4v8M120 4v8" stroke="#1225FD" stroke-width="2"/><text x="96" y="46" font-size="9" fill="#0B1A8C" font-weight="bold">WC</text><text x="116" y="46" font-size="9" fill="#0B1A8C" font-weight="bold">WC</text></svg>'
};
// cat: 'veh' furgones/buses · 'tractor' · 'comedor'   (para agregar un tipo nuevo: sumarlo aquí, en bloques() y en el servidor)
const TIPOS = {
  furgon:  { t: 'Furgón de personal',  d: 'Furgón o van que traslada trabajadores al campo', cat: 'veh', med: 'km', idL: 'Patente', ej: 'Ej: KXPT21', mm: 'Ej: Hyundai H1' },
  minibus: { t: 'Minibús de personal', d: 'Minibús o bus para cuadrillas grandes', cat: 'veh', med: 'km', idL: 'Patente', ej: 'Ej: KXPT21', mm: 'Ej: Mercedes Sprinter' },
  tractor: { t: 'Tractor',             d: 'Tractor agrícola (con o sin equipo de fumigación)', cat: 'tractor', med: 'h', idL: 'Patente o N° interno', ej: 'Ej: Tractor 3 o JK1234', mm: 'Ej: John Deere 5075E' },
  comedor: { t: 'Comedor móvil',       d: 'Comedor de campo con estación de agua y baños', cat: 'comedor', idL: 'Número o nombre del comedor', ej: 'Ej: Comedor 1', mm: 'Ej: Carro comedor 30 personas' }
};
const CAT = () => TIPOS[S.tipo] ? TIPOS[S.tipo].cat : '';
function licNecesaria() { if (CAT() === 'tractor') return ['D']; const a = num(S.asientos); if (a <= 8) return ['B', 'A2', 'A3']; if (a <= 16) return ['A2', 'A3']; return ['A3']; }
const I = (id, e, t, tip, why, crit) => ({ id, e, t, tip, why, crit: !!crit });

// ===================== BLOQUES =====================
function bCond(tr) { return { id: 'cond', ic: '🧑‍✈️', t: 'Conductor apto', sn: true, d: tr ? 'Antes de revisar el tractor, revísate a ti.' : 'Antes de revisar el vehículo, revísate a ti. Llevas la vida de toda la cuadrilla.', items: [
  I('descanso', '😴', 'Dormí bien y no ando con sueño', 'Mínimo 7 horas. Si te da sueño, para en un lugar seguro.', tr ? 'Un segundo dormido arriba del tractor basta para caer a un canal o volcar en una pendiente.' : 'Quedarse dormido al volante de madrugada es una de las principales causas de volcamiento de furgones agrícolas.', 1),
  I('alcohol', '🚫', 'Sin alcohol ni drogas', 'Ni siquiera "una cervecita" de anoche si todavía se siente.', 'El alcohol baja los reflejos y es causal de despido y de pérdida del seguro.', 1),
  I('remedios', '💊', 'Sin remedios que den sueño', 'Antialérgicos, relajantes o para dormir: si tomaste, avisa a tu jefatura.', 'Algunos remedios bajan los reflejos igual que el alcohol.', 1),
  I('celular', '📵', 'No usaré el celular mientras manejo', 'Solo manos libres, o detenido en un lugar seguro.', 'Mirar el celular 3 segundos es avanzar a ciegas varios metros.'),
  tr ? I('terreno', '🗺️', 'Conozco el terreno y sus peligros', 'Pendientes, canales, zanjas, hoyos, cables eléctricos bajos y personas trabajando en las hileras.', 'El volcamiento de tractor es la primera causa de muerte en el campo: casi siempre en pendientes o bordes de canal.', 1)
     : I('ruta', '🗺️', 'Conozco la ruta y sus peligros', 'Caminos de tierra, puentes angostos, cruces de línea férrea, curvas y canales.', 'En caminos rurales los peligros aparecen de repente: conocerlos te da tiempo de reaccionar.')]}; }
const B_EXT = { id: 'ext', ic: '🚶', t: 'Vuelta al vehículo', d: 'Camina alrededor antes de subirte. Dos minutos que evitan una pana o un accidente.', items: [
  I('neum', '🛞', 'Neumáticos y tuercas, incluye repuesto', 'Sin cortes ni globos, con dibujo (mínimo 1,6 mm), bien inflados y sin tuercas sueltas.', 'Un neumático liso en camino de ripio o mojado hace patinar el furgón cargado de gente.', 1),
  I('luces', '💡', 'Luces: altas, bajas, freno, intermitentes y retroceso', 'Enciéndelas y míralas (o pide ayuda a un compañero).', 'Salen de madrugada y vuelven al atardecer: si no te ven, te chocan.', 1),
  I('fugas', '💧', 'Sin fugas bajo el vehículo', 'Mira el piso: aceite, petróleo, bencina, refrigerante o líquido de frenos.', 'Una fuga de frenos te deja sin control; una de combustible puede encenderse.', 1),
  I('espejos', '🪞', 'Espejos', 'Completos, firmes, sin trizaduras y bien regulados.', 'Al bajar la cuadrilla hay gente caminando alrededor: el espejo te muestra dónde están.'),
  I('parabrisas', '🪟', 'Parabrisas y limpiaparabrisas', 'Sin trizaduras frente a tus ojos; plumillas y agua funcionan.', 'Con neblina, lluvia o polvo del camino, ver bien es frenar a tiempo.'),
  I('carroceria', '🚐', 'Carrocería y parachoques', 'Sin piezas sueltas, cortantes ni latas salidas.', 'Una lata suelta corta a quien sube o baja apurado.')]};
const B_CAB = { id: 'cab', ic: '🎛️', t: 'Cabina y mandos', d: 'Ya arriba, con el motor encendido. Prueba todo antes de mover el vehículo.', items: [
  I('frenos', '🛑', 'Frenos y freno de mano', 'Prueba a baja velocidad: pedal firme, no se va al fondo ni tira hacia un lado. El freno de mano sujeta en pendiente.', 'Con el furgón lleno, frena más largo. Si los frenos fallan, no hay cómo parar.', 1),
  I('direccion', '🎯', 'Dirección', 'Sin juego, ruidos ni tirones al girar.', 'Una dirección con juego se descontrola en una curva de ripio.', 1),
  I('cinturon', '🔒', 'Cinturón del conductor', 'Engancha, se recoge y no está cortado.', 'Tú das el ejemplo: si tú te lo pones, la cuadrilla también.', 1),
  I('bocina', '📢', 'Bocina y alarma de retroceso', 'Ambas suenan fuerte.', 'En el campo hay trabajadores a pie alrededor del furgón al estacionar.', 1),
  I('tablero', '📟', 'Tablero sin luces de falla', 'Ninguna luz roja queda encendida al partir.', 'El vehículo te avisa antes de una falla mayor: escúchalo.'),

function bloques() {
  const t = S.tipo, c = CAT(); if (!t) return [];
  if (c === 'veh') return [bCond(false), B_EXT, B_CAB, bPas(t), B_NIV, B_SEG, B_ASEO];
  if (c === 'tractor') return [bCond(true), T_EXT, T_CAB, T_ENG, T_NIV].concat(S.fumiga === 'si' ? [F_EQ, F_EPP] : []).concat([T_SEG, T_ASEO]);
  return [C_EST, C_AGUA, C_BANO, C_SEG, C_ASEO];
}

  const E = evaluar(), col = E.resultado === 'NO APTO' ? 'var(--bad)' : E.resultado === 'APTO' ? 'var(--ok)' : 'var(--warn)';
  const ic = E.resultado === 'NO APTO' ? '🛑' : E.resultado === 'APTO' ? '🟢' : '🟠';
  return `<div class="sem" style="background:${col}"><div style="font-size:40px">${ic}</div><div class="r">${E.resultado}</div><div class="m">${esc(E.mensaje)}</div></div>
  <div class="kpis"><div class="kpi"><b style="color:${col}">${E.pct}%</b><span>Cumplimiento</span></div><div class="kpi"><b style="color:${E.aseo == null ? 'var(--mut)' : E.aseo >= 80 ? 'var(--ok)' : E.aseo >= 50 ? 'var(--warn)' : 'var(--bad)'}">${E.aseo == null ? '—' : E.aseo + '%'}</b><span>Aseo</span></div><div class="kpi"><b>${E.al.length}</b><span>Alertas</span></div></div>
  <div class="card"><h3>🚨 Alertas</h3>${E.al.length ? E.al.map(a => `<div class="al"><i class="lv-${a.nivel}">${a.nivel.toUpperCase()}</i><div><b>${esc(a.item)}</b>${a.det ? '<div class="mut small">' + esc(a.det) + '</div>' : ''}</div></div>`).join('') : '<div class="mut">Sin alertas 🎉</div>'}</div>
  <div class="card"><h3>📋 Resumen</h3><div class="small" style="line-height:1.7"><b>Responsable:</b> ${esc(S.persona.nombre)}<br><b>${esc(TIPOS[S.tipo].t)}:</b> ${esc(patKey(S.patente))}${S.marca ? ' · ' + esc(S.marca) : ''}${estadoEquipo() === 'Pendiente' ? ' <span class="badge b-w">⏳ por verificar</span>' : ''}${datosInforme().map(x => '<br><b>' + esc(x[0]) + ':</b> ' + esc(x[1])).join('')}</div>
  <label class="l">Observaciones (opcional)</label><textarea placeholder="Algo más que quieras informar" oninput="S.obs=this.value;guarda()">${esc(S.obs)}</textarea></div>`;
}
function vReporte() {
  const w = g => { const on = g.fijo || S.rep.indexOf(g.key) >= 0;
    return `<div class="who ${on ? 'on' : ''} ${g.fijo ? 'lock' : ''}" onclick="${g.fijo ? '' : `togRep('${g.key}')`}"><div class="ck">${on ? '✓' : ''}</div><div><b>${esc(g.nombre)}</b><span>${esc(g.cargo)}${g.fijo ? ' · recibe siempre copia' : ''}${!g.mail ? ' · <b style="color:var(--warn)">sin correo registrado</b>' : ''}</span></div></div>`; };
  return `<div class="card"><div class="bh"><div class="ic">📤</div><div><h2>Se reporta a</h2><div class="mut small">${S.enc.some(g => !g.fijo) ? 'Toca para marcar o desmarcar a los demás' : 'El informe les llega por correo'}</div></div></div>${S.enc.map(w).join('')}</div>
  <div class="card"><h3>✍️ Tu firma</h3><p class="m">Firmas que revisaste y que lo informado es real.</p><canvas id="cv"></canvas><button class="why" onclick="borraFirma()">Borrar firma</button></div>`;
}
function togRep(k) { const i = S.rep.indexOf(k); if (i >= 0) S.rep.splice(i, 1); else S.rep.push(k); const sc = window.scrollY; render(); window.scrollTo(0, sc); }
let cv, cx, dib = false, trazo = 0;
function firmaInit() {
  cv = $('#cv'); if (!cv) return; const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; cx = cv.getContext('2d'); cx.scale(dpr, dpr); cx.lineWidth = 2.4; cx.lineCap = 'round'; cx.strokeStyle = '#0B1A8C';
  if (S.firma) { const im = new Image(); im.onload = () => cx.drawImage(im, 0, 0, r.width, r.height); im.src = S.firma; }
  const pos = e => { const b = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [t.clientX - b.left, t.clientY - b.top]; };
  const ini = e => { e.preventDefault(); dib = true; const [x, y] = pos(e); cx.beginPath(); cx.moveTo(x, y); };
  const mov = e => { if (!dib) return; e.preventDefault(); const [x, y] = pos(e); cx.lineTo(x, y); cx.stroke(); trazo++; };
  const fin = () => { if (dib) { dib = false; if (trazo > 8) { S.firma = cv.toDataURL('image/png'); guarda(); guia(); } } };
  cv.addEventListener('pointerdown', ini); cv.addEventListener('pointermove', mov); window.addEventListener('pointerup', fin);
}
function borraFirma() { S.firma = ''; trazo = 0; cx && cx.clearRect(0, 0, cv.width, cv.height); guarda(); guia(); }
function vFin() {
  const f = S.fin || {};
  if (!f.ok) return `<div class="card center"><div class="spin"></div><p>Generando informe… no cierres la app.</p></div>`;
  return `<div class="card center"><div class="big">${f.resultado === 'NO APTO' ? '🛑' : '🎉'}</div><h2>¡Chequeo enviado!</h2>
  <p class="m">Código <b>${esc(f.codigo)}</b>${f.enviados && f.enviados.length ? '<br>Informe enviado a: ' + esc(f.enviados.join(', ')) : ''}${f.sinCorreo && f.sinCorreo.length ? '<br><span style="color:var(--warn)">Sin correo registrado: ' + esc(f.sinCorreo.join(', ')) + ' (avísales tú)</span>' : ''}</p>
  ${f.nuevo ? '<div class="info w" style="text-align:left">🆕 Quedó <b>pendiente de verificación</b>. Daniel Zunino recibió la alerta para revisarlo.</div><div style="height:10px"></div>' : ''}
  ${f.resultado === 'NO APTO' ? `<div class="info x" style="text-align:left">🛑 <b>${esc(NO_SALE[f.cat] || 'No se usa')} hasta corregir.</b> Avisa de inmediato a tu jefatura.</div><div style="height:10px"></div>` : ''}
  <a class="btn" href="${esc(f.link)}" target="_blank" style="text-decoration:none">📄 Ver informe PDF</a><div style="height:10px"></div>
  <button class="btn gh" onclick="nuevo()">Hacer otro chequeo</button></div><div class="pie">Creado por Daniel Zunino · Integra Prevención SpA</div>`;
}
function nuevo() { Object.assign(S, VACIO(), { paso: 1 }); render(); }

// ===================== GUÍA: la manito apunta al siguiente paso =====================
function objetivo() {
  const p = S.paso, c = CAT();
  if (p === 0) { if (S._noRut && $('#bInscribir')) return $('#bInscribir'); const r = $('#rut'); return r && !rutValido(r.value) ? r : $('#bRut'); }
  if (p === 1) return $('.eq');
  if (p === 2) { const q = sel => document.querySelector('#app ' + sel);
    if (!S.nuevoEq && !S.patente) return q('#selEq');
    if (S.nuevoEq && !patKey(S.patente)) return q('#in-pat');
    if (S.nuevoEq && !String(S.marca).trim()) return q('#in-marca');
    if (!String(S.lugar).trim()) return q('#in-lugar');
    if (c === 'veh') { if (!num(S.asientos)) return q('#in-asientos'); if (S.pasajeros === '') return q('#in-pasajeros'); }
    if (c === 'tractor') { if (!S.fumiga) return q('#sinoFum'); if (S.fumiga === 'si' && !S.fumiEq.trim()) return q('#in-fumiEq'); }
    if (c === 'comedor') { if (!num(S.trab)) return q('#in-trab'); if (S.banos === '') return q('#in-banos'); }
    if (TIPOS[S.tipo].med && !S.km) return q('#in-km');
    for (const k of ['soap', 'permiso', 'rt']) { const el = q('#f-' + k); if (el && !S[k]) return el; }
    return $('#bNext'); }
  if (p >= 3 && p < pasoResumen()) { const b = bloques()[p - 3];
    for (const it of b.items) { const k = b.id + '.' + it.id, v = S.res[k], box = document.getElementById('it-' + k.replace('.', '-'));
      if (!v) return box && box.querySelector('.opts'); if ((v === 'R' || v === 'M') && !(S.com[k] || '').trim()) return box && box.querySelector('textarea'); }
    return $('#bNext'); }
  if (p === pasoReporte()) return S.firma ? $('#bNext') : $('#cv');
  if (p === pasoResumen()) return $('#bNext');
  return null;
}
let _guiaT = 0;
function guia(mover) {
  clearTimeout(_guiaT); _guiaT = setTimeout(() => {
    document.querySelectorAll('.pulso').forEach(e => e.classList.remove('pulso'));
    const m = $('#mano'), el = objetivo(); if (!m) return;
    if (!el || el.offsetParent === null) { m.classList.remove('on'); return; }
    el.classList.add('pulso');
    const enFoot = !!el.closest('#foot');
    if (mover && !enFoot) { const r = el.getBoundingClientRect(); if (r.top < 90 || r.bottom > innerHeight - 110) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    setTimeout(ponMano, mover ? 420 : 0);
  }, 60);
}
function ponMano() { const m = $('#mano'), el = document.querySelector('.pulso'); if (!m || !el) return;
  const r = el.getBoundingClientRect(); m.style.left = Math.min(innerWidth - 50, r.left + Math.min(r.width * 0.7, r.width - 20)) + 'px'; m.style.top = (r.bottom - 14) + 'px';
  if (r.bottom + 40 > innerHeight) { m.style.top = (r.top - 46) + 'px'; m.textContent = '👇'; } else m.textContent = '👆';
  m.classList.add('on'); }
addEventListener('scroll', () => requestAnimationFrame(ponMano), { passive: true }); addEventListener('resize', () => guia());
document.addEventListener('input', () => guia());

// ===================== NAVEGACIÓN =====================
function validar() {
  const p = S.paso, c = CAT(), T = TIPOS[S.tipo];
  if (p === 1 && !S.tipo) return 'Elige qué vas a revisar.';
  if (p === 2) { if (!patKey(S.patente)) return S.nuevoEq ? 'Escribe el dato: ' + T.idL.toLowerCase() + '.' : 'Elige de la lista o agrégalo.';
    if (S.nuevoEq && !S.marca.trim()) return 'Escribe la ' + (c === 'comedor' ? 'descripción' : 'marca o modelo') + '.';
    if (S.nuevoEq && S.equipos.some(x => patKey(x.p) === patKey(S.patente))) return 'Ya está en la lista: elígelo ahí.';
    if (!S.lugar.trim()) return c === 'veh' ? 'Indica la ruta o recorrido.' : 'Indica el predio o lugar.';
    if (c === 'veh') { if (!num(S.asientos)) return 'Indica cuántos asientos de pasajeros tiene.'; if (S.pasajeros === '') return 'Indica cuántos trabajadores vas a llevar.'; if (num(S.asientos) > 60) return 'Revisa el número de asientos.'; }
    if (c === 'tractor') { if (!S.fumiga) return 'Responde si hoy lleva equipo de fumigación.'; if (S.fumiga === 'si' && !S.fumiEq.trim()) return 'Indica qué equipo de fumigación lleva.'; }
    if (c === 'comedor') { if (!num(S.trab)) return 'Indica cuántos trabajadores usan el comedor.'; if (S.banos === '') return 'Indica cuántos baños hay (si no hay, pon 0).'; }
    if (T.med && !S.km) return 'Indica el ' + (T.med === 'km' ? 'kilometraje' : 'horómetro') + '.';
    if (c === 'veh' && (!S.soap || !S.permiso || !S.rt)) return 'Completa las 3 fechas de documentos. Si no las encuentras, avisa a tu jefatura.'; }
  if (p >= 3 && p < pasoResumen()) { const b = bloques()[p - 3];
    for (const it of b.items) { const k = b.id + '.' + it.id, v = S.res[k];
      if (!v) { ir(k); return 'Falta responder: ' + it.t; }
      if ((v === 'R' || v === 'M') && (S.com[k] || '').trim().length < 3) { ir(k); return 'Cuenta brevemente qué pasa en: ' + it.t; } } }
  if (p === pasoReporte() && !S.firma) return 'Falta tu firma (dibuja con el dedo en el recuadro).';
  return '';
}
function ir(k) { const el = document.getElementById('it-' + k.replace('.', '-')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
$('#bBack').onclick = () => { if (S.enviando) return; S.paso = S.paso <= 1 ? 0 : S.paso - 1; render(); };
$('#bNext').onclick = () => { if (S.enviando) return; const e = validar(); if (e) { alertaUI(e); VOZ.say(e); guia(true); return; } if (S.paso === pasoReporte()) return enviar(); S.paso++; render(); };
async function enviar() {
  if (S.enviando) return;
  S.enviando = true; if (!S.envio) S.envio = Date.now().toString(36) + Math.random().toString(36).slice(2, 8); render();
  const E = evaluar(), bl = bloques(), c = CAT();
  const fotos = Object.keys(S.fotos).map(k => { const [b, i] = k.split('.'), bb = bl.find(x => x.id === b), it = bb && bb.items.find(x => x.id === i); return it ? { item: it.t, b64: S.fotos[k] } : null; }).filter(Boolean);
  const body = { envio: S.envio, pid: S.persona.id, tipo: S.tipo, cat: c, patente: S.patente, nuevo: S.nuevoEq, marca: S.marca, anio: S.anio, fotoEquipo: S.nuevoEq ? S.fotoEq : '',
    lugar: S.lugar, asientos: c === 'veh' ? num(S.asientos) : '', pasajeros: c === 'veh' ? num(S.pasajeros) : '', trab: c === 'comedor' ? num(S.trab) : '', banos: c === 'comedor' ? num(S.banos) : '',
    fumiga: c === 'tractor' && S.fumiga === 'si', fumiEq: S.fumiEq, producto: S.producto,
    km: S.km, prox: S.prox, soap: c === 'veh' ? S.soap : '', permiso: c === 'veh' ? S.permiso : '', rt: c === 'veh' ? S.rt : '', datos: datosInforme(),
    resultado: E.resultado, mensaje: E.mensaje, pct: E.pct, aseo: E.aseo, alertas: E.al, okItems: E.okItems, obs: S.obs, reportar: S.rep, firma: S.firma, fotos,
    bloques: bl.map(b => ({ t: b.t, sn: !!b.sn, items: b.items.map(it => ({ t: it.t, crit: it.crit, v: S.res[b.id + '.' + it.id] || '', c: S.com[b.id + '.' + it.id] || '' })) })) };
  const pasoAnt = S.paso; S.paso = pasoFin(); S.fin = null; render();
  try {
    const d = await api('apiGuardar', body);
    if (!d.ok) throw d.error || 'error';
    S.fin = Object.assign(d, { resultado: E.resultado, cat: c }); S.enviando = false; try { localStorage.removeItem(LS); } catch (e) {}
    $('#app').innerHTML = vFin(); $('#foot').classList.add('hide'); $('#bar').style.width = '100%'; $('#mano').classList.remove('on');
    VOZ.say(E.resultado === 'NO APTO' ? 'Chequeo enviado. Recuerda: ' + NO_SALE[c].toLowerCase() + ' hasta corregir. Avisa de inmediato a tu jefatura.' : '¡Chequeo enviado! Gracias por cuidar a tu cuadrilla.');
  } catch (e) { S.enviando = false; S.paso = pasoAnt; render(); alertaUI('No se pudo enviar. Revisa tu señal y toca Enviar de nuevo: tu chequeo está guardado.'); VOZ.say('No se pudo enviar. Revisa tu señal e intenta de nuevo. Tu chequeo está guardado.'); }
}
// Arranque
(async () => {
  const q = new URLSearchParams(location.search);
  const enlace = q.get('aprobar') ? { api: 'aprobar', tok: q.get('aprobar'), t: 'Verificación de equipo' } : q.get('activar') ? { api: 'activar', tok: q.get('activar'), t: 'Activación de persona' } : null;
  if (enlace) {
    try { const d = await fetch(SCRIPT_URL + '?' + new URLSearchParams({ api: enlace.api, tok: enlace.tok, ok: q.get('ok') })).then(r => r.json());
      $('#app').innerHTML = `<div class="card center"><div class="big">${!d.ok ? '⚠️' : d.aprobado ? '✅' : '❌'}</div><h2>${enlace.t}</h2><p class="m" style="font-size:16px">${esc(d.msg || d.error || '')}</p><a class="btn gh" href="${location.pathname}" target="_self" style="text-decoration:none">Ir a los chequeos</a></div>`;
    } catch (e) { $('#app').innerHTML = '<div class="card info x">No se pudo conectar con el servidor. Intenta de nuevo.</div>'; }
    return;
  }
  if (/PEGAR_AQUI/.test(SCRIPT_URL)) { render(); return; }
  try { const d = await api('apiInicio'); S.form = d.form || ''; } catch (e) {}
  render();
})();
</script>
